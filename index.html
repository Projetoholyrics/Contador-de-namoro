<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Davi ❤ Eduarda</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Corações animados -->
  <div class="hearts"></div>

  <!-- Borboletas -->
  <img src="https://i.imgur.com/4b9ZyOF.png" class="butterfly b1">
  <img src="https://i.imgur.com/4b9ZyOF.png" class="butterfly b2">

  <div class="container">

    <h1>Davi ❤️ Eduarda</h1>
    <p class="frase">"Não tenho palavras pra agradecer por ter você na minha vida, minha princesa."</p>

    <div id="contador">
      <div class="box">
        <span id="anos">0</span>
        <p>Anos</p>
      </div>

      <div class="box">
        <span id="meses">0</span>
        <p>Meses</p>
      </div>

      <div class="box">
        <span id="dias">0</span>
        <p>Dias</p>
      </div>
    </div>

    <img src="foto.jpg" class="foto" alt="Foto do casal">
  </div>

  <script src="script.js"></script>
</body>
</html>
