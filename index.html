<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davi & Eduarda 💙</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Música somente áudio (vídeo invisível) -->
    <iframe 
        width="0" 
        height="0"
        src="https://www.youtube.com/embed/EV7U6hN8-ss?autoplay=1&loop=1&playlist=EV7U6hN8-ss"
        frameborder="0"
        allow="autoplay">
    </iframe>

    <!-- Fundo escurecido -->
    <div class="overlay"></div>

    <h1 class="title">Davi ❤️ Eduarda</h1>

    <!-- Contador Animado -->
    <div id="contador" class="contador"></div>

    <!-- Galeria com 3 fotos -->
    <div class="galeria">
        <img src="https://github.com/Projetoholyrics/Contador-de-namoro/blob/main/Imagem%20do%20WhatsApp%20de%202025-11-01%20%C3%A0(s)%2022.16.41_acc35c0d.jpg?raw=true" class="foto">
        <img src="https://github.com/Projetoholyrics/Contador-de-namoro/blob/main/Imagem%20do%20WhatsApp%20de%202025-11-01%20%C3%A0(s)%2022.16.53_d6046436.jpg?raw=true" class="foto">
        <img src="https://github.com/Projetoholyrics/Contador-de-namoro/blob/main/Imagem%20do%20WhatsApp%20de%202025-11-03%20%C3%A0(s)%2008.05.57_b237d787.jpg?raw=true" class="foto">
    </div>

    <script>
        function atualizarContador() {
            const inicio = new Date("2024-08-28T00:00:00");
            const agora = new Date();
            const diff = agora - inicio;

            const anos = Math.floor(diff / (1000 * 60 * 60 * 24 * 365));
            const meses = Math.floor((diff % (1000 * 60 * 60 * 24 * 365)) / (1000 * 60 * 60 * 24 * 30.44));
            const dias = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));

            document.getElementById("contador").innerHTML =
                `${anos} anos • ${meses} meses • ${dias} dias`;
        }

        atualizarContador();
        setInterval(atualizarContador, 1000);
    </script>

</body>
</html>
